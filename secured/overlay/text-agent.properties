# Secured mode (scripts/secured.py): appended to the sample's text-agent application.properties.
# The agent accepts only tokens from the demo realm, and only callers with the a2a-caller role.
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8190}/realms/agents
quarkus.oidc.application-type=service
quarkus.oidc.client-id=summarizer
%translator.quarkus.oidc.client-id=translator
quarkus.oidc.roles.role-claim-path=realm_access/roles

# Only the health checks are public. The Agent Card needs the a2a-caller role too: the client sends
# the AgentAuthProvider credentials on the card request (quarkiverse/quarkus-langchain4j#3205).
quarkus.http.auth.permission.public.paths=/q/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.policy.a2a-caller.roles-allowed=a2a-caller
quarkus.http.auth.permission.a2a.paths=/*
quarkus.http.auth.permission.a2a.policy=a2a-caller

# Publishing the Agent Card to the secured Registry (quarkiverse/quarkus-langchain4j#3145)
quarkus.langchain4j.a2a.apicurio-registry.auth.token-endpoint=${KEYCLOAK_URL:http://localhost:8190}/realms/agents/protocol/openid-connect/token
quarkus.langchain4j.a2a.apicurio-registry.auth.client-id=summarizer
quarkus.langchain4j.a2a.apicurio-registry.auth.client-secret=summarizer-secret
%translator.quarkus.langchain4j.a2a.apicurio-registry.auth.client-id=translator
%translator.quarkus.langchain4j.a2a.apicurio-registry.auth.client-secret=translator-secret
