# Secured mode (scripts/secured.py): appended to the sample's weather-server application.properties.
# The MCP endpoint accepts only tokens from the demo realm with the mcp-caller role.
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8190}/realms/agents
quarkus.oidc.application-type=service
quarkus.oidc.client-id=weather-server
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.http.auth.permission.public.paths=/q/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.policy.mcp-caller.roles-allowed=mcp-caller
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=mcp-caller
