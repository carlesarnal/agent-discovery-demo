# Secured mode (scripts/secured.py): appended to the sample's orchestrator application.properties.
# The orchestrator's own identity, from the client-credentials grant
quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://localhost:8190}/realms/agents
quarkus.oidc-client.client-id=orchestrator
quarkus.oidc-client.credentials.secret=orchestrator-secret
quarkus.oidc-client.grant.type=client

# Discovering agents and MCP servers in the secured Registry (quarkiverse/quarkus-langchain4j#3145)
quarkus.langchain4j.a2a.apicurio-registry.auth.token-endpoint=${KEYCLOAK_URL:http://localhost:8190}/realms/agents/protocol/openid-connect/token
quarkus.langchain4j.a2a.apicurio-registry.auth.client-id=orchestrator
quarkus.langchain4j.a2a.apicurio-registry.auth.client-secret=orchestrator-secret
quarkus.langchain4j.mcp.apicurio-registry.auth.token-endpoint=${KEYCLOAK_URL:http://localhost:8190}/realms/agents/protocol/openid-connect/token
quarkus.langchain4j.mcp.apicurio-registry.auth.client-id=orchestrator
quarkus.langchain4j.mcp.apicurio-registry.auth.client-secret=orchestrator-secret
quarkus.oidc-client.refresh-token-time-skew=60s
