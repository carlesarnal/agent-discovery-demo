<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Discovery Orchestrator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg: #0f1117; --card: #1a1d27; --code: #151820;
    --text: #e4e7ef; --dim: #8b90a0;
    --blue: #4f8ff7; --purple: #a78bfa; --green: #34d399;
    --orange: #fb923c; --pink: #f472b6; --red: #ef4444; --border: #2a2e3b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 32px; }
  h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; }
  .subtitle { color: var(--dim); font-size: 0.9rem; margin-bottom: 24px; }
  .container { max-width: 1200px; margin: 0 auto; }
  .input-area { display: flex; gap: 12px; margin-bottom: 24px; }
  .input-area input {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 18px; color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 1rem; outline: none;
  }
  .input-area input:focus { border-color: var(--blue); }
  .input-area input::placeholder { color: var(--dim); }
  .input-area button {
    background: var(--blue); color: white; border: none; border-radius: 10px;
    padding: 14px 28px; font-size: 1rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge-blue { background: rgba(79,143,247,0.15); color: var(--blue); }
  .badge-green { background: rgba(52,211,153,0.15); color: var(--green); }
  .badge-purple { background: rgba(167,139,250,0.15); color: var(--purple); }
  .badge-orange { background: rgba(251,146,60,0.15); color: var(--orange); }
  .badge-pink { background: rgba(244,114,182,0.15); color: var(--pink); }

  /* Event log */
  .log { display: flex; flex-direction: column; gap: 12px; }
  .log-entry {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; opacity: 0; transform: translateY(8px);
    animation: fadeIn 0.3s ease forwards;
  }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

  .log-entry.running { border-color: var(--blue); }
  .log-entry.done { border-color: var(--green); }
  .log-entry.error { border-color: var(--red); }

  .log-header {
    padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none;
  }
  .log-header:hover { background: rgba(255,255,255,0.02); }

  .log-icon {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; font-weight: 700; border: 2px solid var(--border);
    background: var(--code);
  }
  .log-entry.running .log-icon { border-color: var(--blue); animation: pulse 1.5s ease-in-out infinite; }
  .log-entry.done .log-icon { border-color: var(--green); background: rgba(52,211,153,0.1); }
  .log-entry.error .log-icon { border-color: var(--red); }

  .log-title { font-weight: 600; font-size: 0.85rem; flex: 1; }
  .log-time { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--dim); }
  .log-detail {
    font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
    color: var(--dim); padding: 0 16px 10px 58px; line-height: 1.4;
  }
  .log-entry.running .log-detail { color: var(--blue); }
  .log-entry.done .log-detail { color: var(--green); }

  .log-payload {
    display: none; padding: 0 16px 14px 16px;
  }
  .log-payload.visible { display: block; }
  .log-payload pre {
    background: var(--code); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem; line-height: 1.5; color: var(--dim);
    max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  }
  .log-payload .label { color: var(--orange); font-weight: 600; font-size: 0.72rem; display: block; margin: 8px 0 4px 0; }
  .log-payload .label:first-child { margin-top: 0; }

  /* Result */
  .result-box {
    background: var(--card); border: 2px solid var(--green); border-radius: 12px;
    padding: 24px; margin-top: 16px; display: none;
    animation: fadeIn 0.4s ease forwards;
  }
  .result-box.visible { display: block; }
  .result-box h3 { font-size: 0.8rem; color: var(--green); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .result-box p { font-size: 1.05rem; line-height: 1.7; }

  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div class="container">
  <h1>Agent Discovery Orchestrator</h1>
  <p class="subtitle">Registry-backed discovery and delegation via open standards
    <span class="badge badge-blue" style="font-size:0.65rem;">Apicurio Registry</span>
    <span class="badge badge-purple" style="font-size:0.65rem;">A2A Protocol</span>
    <span class="badge badge-orange" style="font-size:0.65rem;">Ollama</span>
  </p>

  <div class="input-area">
    <input type="text" id="request" placeholder="e.g. Summarize the benefits of open standards for AI governance" />
    <button id="send" onclick="run()">Orchestrate</button>
  </div>

  <div class="log" id="log"></div>

  <div class="result-box" id="result-box">
    <h3>Agent Response</h3>
    <p id="result-text"></p>
  </div>
</div>

<script>
const stepConfig = {
  search:   { num: '1', title: 'Discover Agents', badge: 'Registry SDK', badgeClass: 'badge-blue' },
  inspect:  { num: '2', title: 'Inspect Agent Cards', badge: 'AGENT_CARD', badgeClass: 'badge-purple' },
  match:    { num: '3', title: 'Select Best Agent', badge: 'Skill Matching', badgeClass: 'badge-pink' },
  delegate: { num: '4', title: 'Delegate via A2A', badge: 'JSON-RPC', badgeClass: 'badge-orange' },
  result:   { num: '5', title: 'Result', badge: 'LLM Response', badgeClass: 'badge-green' },
  error:    { num: '!', title: 'Error', badge: 'Failed', badgeClass: 'badge-orange' }
};

let startTime = null;
let stepTimes = {};

function resetLog() {
  startTime = Date.now();
  stepTimes = {};
  document.getElementById('log').innerHTML = '';
  document.getElementById('result-box').classList.remove('visible');
  document.getElementById('result-text').textContent = '';
}

function prettyJson(str) {
  try { return JSON.stringify(JSON.parse(str), null, 2); } catch { return str; }
}

function addLogEntry(step, status, detail, payload) {
  const log = document.getElementById('log');
  const cfg = stepConfig[step] || { num: '?', title: step, badge: step, badgeClass: 'badge-blue' };
  const elapsed = Date.now() - startTime;
  const cls = status === 'running' ? 'running' : status;

  // Check if entry for this step already exists (update running → done)
  let existing = document.getElementById('log-' + step);
  if (existing) {
    existing.className = 'log-entry ' + cls;
    existing.querySelector('.log-detail').textContent = detail;
    if (status === 'done' || status === 'error') {
      const duration = elapsed - (stepTimes[step] || 0);
      existing.querySelector('.log-time').textContent = (duration / 1000).toFixed(1) + 's';
    }
    if (payload) {
      setPayload(existing, step, payload);
    }
    if (step === 'result' && status === 'done') {
      showResult(detail);
    }
    return;
  }

  if (status === 'running') stepTimes[step] = elapsed;

  const entry = document.createElement('div');
  entry.className = 'log-entry ' + cls;
  entry.id = 'log-' + step;

  const timeStr = (status === 'done' || status === 'error')
    ? ((elapsed - (stepTimes[step] || 0)) / 1000).toFixed(1) + 's'
    : '';

  entry.innerHTML = `
    <div class="log-header" onclick="togglePayload('${step}')">
      <div class="log-icon">${cfg.num}</div>
      <div class="log-title">${cfg.title} <span class="badge ${cfg.badgeClass}">${cfg.badge}</span></div>
      <div class="log-time">${timeStr}</div>
    </div>
    <div class="log-detail">${detail}</div>
    <div class="log-payload" id="payload-${step}"></div>
  `;

  log.appendChild(entry);

  if (payload) {
    setPayload(entry, step, payload);
  }

  if (step === 'result' && status === 'done') {
    showResult(detail);
  }

  entry.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function setPayload(entry, step, payload) {
  const payloadEl = entry.querySelector('.log-payload');
  if (step === 'delegate') {
    try {
      const p = JSON.parse(payload);
      payloadEl.innerHTML = '<span class="label">REQUEST (message/send)</span><pre>' +
        prettyJson(p.request) + '</pre>' +
        '<span class="label">RESPONSE</span><pre>' +
        prettyJson(p.response) + '</pre>';
    } catch { payloadEl.innerHTML = '<pre>' + payload + '</pre>'; }
  } else if (step === 'match') {
    payloadEl.innerHTML = '<pre>' + prettyJson(payload) + '</pre>';
  } else {
    payloadEl.innerHTML = '<pre>' + prettyJson(payload) + '</pre>';
  }
  payloadEl.classList.add('visible');
}

function togglePayload(step) {
  const el = document.getElementById('payload-' + step);
  if (el) el.classList.toggle('visible');
}

function showResult(text) {
  document.getElementById('result-text').textContent = text;
  document.getElementById('result-box').classList.add('visible');
}

async function run() {
  const input = document.getElementById('request');
  const btn = document.getElementById('send');
  const text = input.value.trim();
  if (!text) return;

  btn.disabled = true;
  resetLog();

  try {
    const response = await fetch('/orchestrate/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: text
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith(':')) continue;
        if (trimmed.startsWith('data:')) {
          try {
            const event = JSON.parse(trimmed.slice(5));
            addLogEntry(event.step, event.status, event.detail, event.payload);
          } catch (e) {}
        }
      }
    }
  } catch (e) {
    addLogEntry('error', 'error', 'Connection failed: ' + e.message);
  }

  btn.disabled = false;
}

document.getElementById('request').addEventListener('keydown', e => {
  if (e.key === 'Enter') run();
});
</script>
</body>
</html>
