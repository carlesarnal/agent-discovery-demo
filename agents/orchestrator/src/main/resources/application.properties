quarkus.http.port=10020

# Apicurio Registry — A2A agent discovery
quarkus.langchain4j.a2a.apicurio-registry.url=${REGISTRY_URL:http://localhost:8080}/apis/registry/v3
quarkus.langchain4j.a2a.apicurio-registry.group-id=a2a-agents

# Apicurio Registry — MCP server discovery
quarkus.langchain4j.mcp.apicurio-registry.url=${REGISTRY_URL:http://localhost:8080}/apis/registry/v3

# Ollama for LLM-based agent selection and MCP tool use
quarkus.langchain4j.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=qwen2.5:7b
quarkus.langchain4j.ollama.chat-model.temperature=0.1
quarkus.langchain4j.ollama.timeout=120s
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# Also used by the manual discovery service for A2A delegation
registry.url=${REGISTRY_URL:http://localhost:8080}
registry.group-id=a2a-agents

quarkus.http.enable-compression=true
quarkus.http.header."Cache-Control".value=no-cache
quarkus.log.level=INFO
quarkus.package.jar.type=uber-jar
