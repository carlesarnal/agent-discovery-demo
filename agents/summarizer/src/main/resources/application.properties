quarkus.http.port=10010

# Ollama configuration
quarkus.langchain4j.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=qwen2.5:1.5b
quarkus.langchain4j.ollama.chat-model.temperature=0.3
quarkus.langchain4j.ollama.timeout=60s

# A2A Apicurio Registry — auto-publish Agent Card on startup
quarkus.langchain4j.a2a.apicurio-registry.url=${REGISTRY_URL:http://localhost:8080}/apis/registry/v3
quarkus.langchain4j.a2a.apicurio-registry.group-id=a2a-agents
quarkus.langchain4j.a2a.apicurio-registry.agent-url=${AGENT_BASE_URL:http://localhost:10010}

# Registry for prompt template rendering
registry.url=${REGISTRY_URL:http://localhost:8080}
registry.prompt.group=prompts
registry.prompt.artifact=summarizer-system-prompt
registry.prompt.version=branch=latest

quarkus.log.level=INFO
quarkus.package.jar.type=uber-jar
