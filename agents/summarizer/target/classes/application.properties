quarkus.http.port=10010

# Ollama configuration
quarkus.langchain4j.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=qwen2.5:1.5b
quarkus.langchain4j.ollama.chat-model.temperature=0.3
quarkus.langchain4j.ollama.timeout=60s

# Agent URL (used in Agent Card for discovery)
agent.base-url=${AGENT_BASE_URL:http://localhost}

# Registry publishing
registry.url=${REGISTRY_URL:http://localhost:8080}
registry.group-id=a2a-agents

quarkus.log.level=INFO
quarkus.package.jar.type=uber-jar
