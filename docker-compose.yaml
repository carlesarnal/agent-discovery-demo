services:
  apicurio-registry:
    image: quay.io/apicurio/apicurio-registry:3.2.0
    ports:
      - "8080:8080"
    environment:
      APICURIO_STORAGE_KIND: "sql"
      APICURIO_STORAGE_SQL_KIND: "h2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
