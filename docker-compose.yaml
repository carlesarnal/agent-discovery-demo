services:
  apicurio-registry:
    image: quay.io/apicurio/apicurio-registry:3.2.4
    ports:
      - "8080:8080"
    environment:
      APICURIO_STORAGE_KIND: "sql"
      APICURIO_STORAGE_SQL_KIND: "h2"
      APICURIO_A2A_ENABLED: "true"
      APICURIO_A2A_AGENT_NAME: "Apicurio Agent Registry"
      APICURIO_A2A_AGENT_DESCRIPTION: "A2A Agent discovery and governance powered by Apicurio Registry"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/apis/registry/v3/system/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  apicurio-registry-ui:
    image: quay.io/apicurio/apicurio-registry-ui:3.2.4
    ports:
      - "8888:8080"
    environment:
      REGISTRY_API_URL: "http://localhost:8080/apis/registry/v3"
    depends_on:
      apicurio-registry:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10

  summarizer:
    build: agents/summarizer
    ports:
      - "10010:10010"
    environment:
      OLLAMA_URL: http://ollama:11434
      REGISTRY_URL: http://apicurio-registry:8080
      AGENT_BASE_URL: http://summarizer
    depends_on:
      apicurio-registry:
        condition: service_healthy
      ollama:
        condition: service_healthy

  translator:
    build: agents/translator
    ports:
      - "10030:10030"
    environment:
      OLLAMA_URL: http://ollama:11434
      REGISTRY_URL: http://apicurio-registry:8080
      AGENT_BASE_URL: http://translator
    depends_on:
      apicurio-registry:
        condition: service_healthy
      ollama:
        condition: service_healthy

  orchestrator:
    build: agents/orchestrator
    ports:
      - "10020:10020"
    environment:
      OLLAMA_URL: http://ollama:11434
      REGISTRY_URL: http://apicurio-registry:8080
    depends_on:
      apicurio-registry:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  ollama-data:
